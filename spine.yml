# V3 business spine config (S10; V2_HARNESS_DESIGN's contested layer, built CONFIG-GATED).
# SPINE_ENFORCE=1 arms ordering/caps/freshness at bet placement+resolution; DEMAND_REFUTED_K>0
# arms the demand-refuted operator checkpoint in guard. BOTH default off -- adopting the spine is
# an explicit operator decision (docs/RUN2_DECISIONS.md), never a stealth default, because the
# demand-first ordering is the design's one contested proposal (method vs strategy-injection).
#
# FORMAT NOTE: this file is parsed by bin/spine.py's deliberate YAML-SUBSET parser -- flat
# `key: value` scalars and one level of `section:` + indented `key: value` maps, '#' comments.
# Extend the parser before extending the format; a config that does not parse fails closed.

stages:
  0: instrument      # exit: a resolved-won probe bet whose metric is `instrument-probe`
  1: substrate       # exit: a resolved-won probe bet whose metric is `substrate-probe`
  2: demand          # exit: a resolved-won `demand-confirmed` bet in the lane
  3: build           # exit: a `delivery` bet PLACED in the lane (building is the bet)
  4: measure         # exit: a resolved `funnel` bet in the lane
  5: conclude

# E1: caps count ACTIVE lanes only; watching lanes (all bets open, none due) get their own cap,
# so an all-slots-watching freeze cannot occur.
lane_caps:
  active: 3
  watching: 6

# E2: a stage-0/1 exit fact older than this SUSPENDS dependent resolutions in the lane (unknown
# is not zero) -- it never un-exits the stage. Stage-2 TTL is a memo knob (off unless set).
freshness_h:
  instrument: 72
  substrate: 72

# ordering: minimum lane stage a bet TYPE may be placed at (the monotone lattice: a brand-new
# lane starts at stage 0, so relabeling work into a "fresh" lane only LOSES permissions).
ordering:
  probe: 0
  demand-confirmed: 2
  delivery: 3
  funnel: 4
  channel-blocked: 0
  other: 0
