<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ポスターの準備ができました — 人生の週マップ</title>
<meta name="robots" content="noindex" />
<style>
  :root{--bg:#f4f1ea;--ink:#1c1c1c;--muted:#6b6660;--line:#d8d2c6;--accent:#c2410c;--card:#fbfaf6}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px;text-align:center}
  h1{font-size:26px;margin:0 0 8px}
  p{color:var(--muted);max-width:52ch;margin:8px auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:24px}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:12px 20px;font-size:15px;background:var(--accent);color:#fff}
  .ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  #status{font-size:14px;color:var(--muted);margin-top:14px;min-height:20px}
  .poster-frame{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.06);max-width:360px;margin:20px auto 0}
  #poster{display:block;width:100%;height:auto}
  .reenter{margin-top:20px;text-align:left;display:none}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
  input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px}
  .mini{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ありがとうございます。ポスターの準備ができました。</h1>
  <p>お支払いが完了しました。印刷用PDFはこのページ上で、お使いの端末の中で生成されます。メール送信も保存もされません。ダウンロードされた瞬間から、それはあなたのものです。</p>

  <div class="card">
    <div class="poster-frame"><svg id="poster" viewBox="0 0 660 1000" aria-label="あなたのポスター"></svg></div>
    <div style="margin-top:18px">
      <button id="download" type="button">ポスターをダウンロード（PDF）</button>
    </div>
    <div id="status">ダウンロードを準備しています…</div>

    <div class="reenter" id="reenter">
      <p class="mini">このブラウザに保存されたデザインが見つかりませんでした（別の端末でお支払いになった場合や、データを消去した場合に起こります）。下に情報を再入力すると、同じポスターが再生成されます。追加料金はかかりません。</p>
      <label for="name">ポスターに載せる名前（任意）</label>
      <input id="name" type="text" maxlength="40" />
      <label for="dob">生年月日</label>
      <input id="dob" type="date" />
      <label for="life">想定寿命（年）</label>
      <select id="life"><option value="80">80</option><option value="90" selected>90</option><option value="100">100</option></select>
      <label for="palette">配色</label>
      <select id="palette"><option value="ink">インク（生成り）</option><option value="dusk">夜明けのインディゴ</option><option value="ember">残り火</option></select>
      <div style="margin-top:16px"><button id="regen" class="ghost" type="button">ポスターを生成</button></div>
    </div>
  </div>

  <p class="mini" style="margin-top:28px">ダウンロードできないときは、上のボタンをもう一度押すか、デスクトップのブラウザでお試しください。制作: Miguel Ingram</p>
</div>

<script src="../jspdf.umd.min.js"></script>
<script src="../liw.js"></script>
<script>
(function(){
  "use strict";
  var STRINGS = {title:"人生の週", subtitle:"横1行が1年、点1つが1週間", titleFont:"'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Hiragino Sans',serif", foot:"life-in-weeks.surge.sh/ja"};
  var $=function(id){return document.getElementById(id);};
  var state=null;
  try{ state=JSON.parse(localStorage.getItem("liw_paid_state")||"null"); }catch(e){}
  if(state && !state.strings) state.strings=STRINGS;
  function preview(st){
    if(!st.strings) st.strings=STRINGS;
    var built=LIW.buildSVG(st,{paid:true});
    var host=$("poster"); host.setAttribute("viewBox","0 0 "+built.W+" "+built.H);
    host.innerHTML=new DOMParser().parseFromString(built.markup,"image/svg+xml").documentElement.innerHTML;
  }
  function doDownload(st){
    if(!st.strings) st.strings=STRINGS;
    $("status").textContent="印刷用ファイルを生成しています…";
    LIW.downloadPdf(st,function(err,format){
      if(err){ $("status").textContent="ダウンロードが始まらない場合は、上のボタンを押してください（デスクトップのブラウザが最も確実です）。"; }
      else if(format==="png"){ $("status").textContent="高解像度のPNG（life-in-weeks-poster.png）をダウンロードしました。印刷所で使える有効なファイルです。デスクトップのブラウザではPDFも取得できます。"; }
      else { $("status").textContent="ダウンロードしました。「life-in-weeks-poster.pdf」をダウンロードフォルダでご確認ください。"; }
    });
  }
  if(state && state.dob){
    preview(state);
    $("download").onclick=function(){ doDownload(state); };
    setTimeout(function(){ doDownload(state); }, 600);
  } else {
    $("status").textContent="";
    $("reenter").style.display="block";
    $("download").style.display="none";
    $("regen").onclick=function(){
      var dob=$("dob").value; if(!dob){ alert("生年月日を入力してください。"); return; }
      var st={name:$("name").value.trim(),dob:dob,lifeYears:parseInt($("life").value,10),palette:$("palette").value,milestones:[],strings:STRINGS};
      state=st; try{ localStorage.setItem("liw_paid_state",JSON.stringify(st)); }catch(e){}
      preview(st); $("download").style.display=""; $("download").onclick=function(){ doDownload(st); }; doDownload(st);
    };
  }
})();
</script>
</body>
</html>
