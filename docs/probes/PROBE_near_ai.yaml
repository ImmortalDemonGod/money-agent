prior_label: "poor-fit (NEAR wallet + registration)"
verdict: flipped
verdict_basis: |-
  LABEL CHANGE (gate 7). Previous: gated (NEAR wallet + registration). New at docs+live-API
  tier: the gate is LOWER than the issue's own falsifier hypothesized -- registration is ONE
  unauthenticated POST ("Step 1: Register (no auth required)") that AUTO-CREATES the NEAR
  account and returns an api_key; no wallet needed beforehand, no review, no KYC in the
  crypto path (Stripe identity verification exists ONLY for the USD fiat rail). #32 said
  "if so it flips to strong-fit (on a different chain)" -- the mechanics flip; the CAVEATS
  are the market's size and state: lifetime volume $35.3K, open jobs $433.15 total across
  80, 36 agents active in 7 days, and the front page says "a major upgrade is coming July
  2026" (mid-relaunch -- everything here may change imminently). Mainnet-vs-testnet
  settlement is UNRESOLVED from docs (registration example returns a .testnet account while
  wallet docs reference mainnet nep141:wrap.near).
probes:
  - step: docs
    status: observed
    finding: |-
      Site topology: near.ai is a confidential-AI company site; the marketplace is
      market.near.ai, currently a transition stub linking /old (the live product) + a
      versioned API. Registration (skill.md, curl-exact): POST /v1/agents/register
      {"handle", "tags"} -> {agent_id, api_key "sk_live_...", near_account_id, handle};
      "Save api_key immediately -- shown only once." Humans enter via agent-issued one-time
      login links. Jobs in NEAR/USDC/USD; "Create job: requires >= 1 NEAR wallet balance";
      award "atomically funds escrow"; auto-dispute at 24h unreviewed; instant jobs
      auto-match a service by category; MCP server for employers; withdrawals to
      NEAR/wNEAR/USDC or USD via Stripe Connect. ToS-vs-docs INCONSISTENCY recorded: ToS
      5.5 "NEAR AI does not process fiat currency payments" (Mar 25 2026) vs the deployed
      Stripe USD rail in skill.md.
    evidence:
      tier: 3
      source_class: primary_docs
      locator: "https://market.near.ai/skill.md (curl, 434 lines) ; /skill/flows/bid-and-deliver.md ; /skill/flows/wallet.md ; /openapi.json (115KB, 'Agent Market API' v0.1.0) ; stub: market.near.ai/ ; live product: /old"
      retrieved_at: "2026-07-20T08:52-08:56Z"
    quotes:
      - '"### Step 1: Register (no auth required)" (skill.md)'
      - '"Give the returned `url` to your human operator -- they must open it and complete Stripe identity/payout verification." (skill.md, USD rail ONLY)'
  - step: terms
    status: observed
    finding: |-
      Agent-native ToS (Jasnah, Inc. d/b/a NEAR AI, last updated 2026-03-25; curl-exact):
      defines Agent and Agent Operator; operator responsible for all agent actions; "NEAR
      AI does not monitor, review, or control the behavior of Agents." DISPUTE RESOLUTION
      IS AUTOMATED (AI-based evaluators, no human review) with consent baked into the
      ToS; human escalation exists only above $500 escrowed. KYC is discretionary ("We may
      require identity or compliance information (including 'know your customer' checks)"),
      not a flow step. Use restrictions include no off-platform payment circumvention, no
      reputation manipulation, no scraping outside the APIs, and no deploying agents that
      "jailbreak ... or manipulate the behavior of other AI systems on the Marketplace."
    evidence:
      tier: 3
      source_class: terms
      locator: "https://market.near.ai/terms-of-service (curl, ~39.8k chars)"
      retrieved_at: "2026-07-20T08:54:35Z"
    quotes:
      - '"8.2 No Monitoring. NEAR AI does not monitor, review, or control the behavior of Agents."'
      - '"6.6 ... dispute rulings may be generated by automated systems, including AI-based evaluators, without human review."'
      - '"6.7 Human Escalation. For disputed Assignments where the Escrowed amount exceeds five hundred U.S. dollars ($500) ..."'
  - step: onchain
    status: not_observed
    finding: |-
      Escrow is "a platform-managed Escrow account on the NEAR Protocol" (ToS 5.1); earned
      balances "held on the Verifier contract" (wallet.md) -- but NO contract address is
      displayed anywhere fetched; nothing to verify on an explorer. Cross-chain deposits
