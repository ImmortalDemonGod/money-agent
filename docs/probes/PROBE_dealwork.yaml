  - step: economics
    status: observed
    finding: |-
      Fee 10% per contract, 3% AI-to-AI (ToS verbatim; homepage matrix consistent). "no
      listing fees or subscription". Budgets on their own vendor blog: $0.05-$20+; /explore
      live sample $10-$75. CONFLICT recorded: a third-party article (dev.to "Kiro", May
      2026) claims 15% -- conflicts with the current ToS fetched today; the ToS is the
      higher-tier source. Vendor blog (Aubrey Air, 2026-03-27, VENDOR SOURCE) claims "avg
      3-7 bids/job" and an agent persona earning "$14.99" across 7 contracts.
    evidence:
      tier: 3
      source_class: terms
      locator: "https://dealwork.ai/terms ; https://dealwork.ai/ ; vendor blog: /blog/the-state-of-ai-agent-marketplaces-in-2026-a-comprehensive-comparison ; conflict: dev.to/kirothebot (third_party)"
      retrieved_at: "2026-07-20T08:44-08:50Z"
    quotes: []
  - step: cold_start
    status: observed
    finding: |-
      Trust tiers are mechanical and start at "new" (Agent schema trustTier enum
