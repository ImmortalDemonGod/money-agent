prior_label: "poor-fit (Stripe/fiat + KYC) -- flagged in #32 as the highest-value re-check"
verdict: flipped
verdict_basis: |-
  LABEL CHANGE (gate 7). Previous: poor-fit, Stripe/fiat + KYC. New: candidate strong-fit at
  docs tier -- agent-API path with no documented KYC. Named falsifier (from #32): "an agent
  API path that issues an API key without KYC" -- OBSERVED: the live OpenAPI spec's
  POST /agents/onboard requires exactly ONE field, agentName (minLength 2); no email, no
  identity, no payment method in the schema; returns the apiKey. SPOT-CHECKED by the session
  lead with an independent fetch of the live spec (~09:30Z): required is ["agentName"]
  alone; the only identity-adjacent field (moltbookIdentityToken) is OPTIONAL. The string "KYC" appears
  NOWHERE on any fetched page including the ToS. Identity-bearing steps sit at PAYOUT
  (Stripe-Connect bank onboarding endpoints), and the rail is not fiat-only: the ToS
  documents USDC-on-Polygon top-ups and the withdraw enum includes "crypto". Fee is 10%
  (3% AI-to-AI), not the previously believed 15%. Untested dimensions (gate 7): the
  undocumented KYA "verification checks"/trust-tier content, and whether onboarding without
  email works in practice (step 4, runbooked).
probes:
  - step: docs
    status: observed
    finding: |-
      Agent-native API ("OpenWork API" v1.0.0): POST /api/v1/agents/onboard -> apiKey
      (ak_xxxxx), auth "Authorization: Bearer {apiKey}". Onboard schema required fields:
      ["agentName"] only; optional: description, modelProvider, capabilityTags,
      connectToken, autonomous, referralCode, etc. Endpoint self-describes as "Autonomous
      agent registration or owner-authorized via connect token." Hosted MCP at
      api.dealwork.ai/mcp ("48 Tools Across 8 Domains"). Wallet: POST /wallet/topup
      (Stripe), POST /wallet/withdraw {amount, method: ["stripe","crypto"]},
      POST /wallet/connect-account + /onboarding ("Get bank onboarding URL") -- the
      identity-bearing surface, at withdrawal. Marketplace scale AS DISPLAYED (landing,
      Tier 4): "265 tasks completed", "129 open tasks", "1.7K marketplace workers"; /explore
      showed "28 human jobs found" (page 1 of 3), budgets $10-$75.
    evidence:
      tier: 3
      source_class: primary_docs
      locator: "https://api.dealwork.ai/openapi.json (live spec) ; https://dealwork.ai/skill.md ; /mcp ; /explore"
      retrieved_at: "2026-07-20T08:44-08:49Z"
    quotes:
      - '"POST /api/v1/agents/onboard with agent name, description, capability tags -> Returns apiKey for all future requests" (skill.md)'
  - step: terms
    status: observed
    finding: |-
      ToS explicitly contemplates agent accounts and pins liability on a human owner. No KYC
      or identity clause exists ("contains no sentences using the terms 'identity' or
      'KYC'" -- targeted re-fetch). Trust tiers + "verification checks" are reserved but
      undocumented.
    evidence:
      tier: 3
      source_class: terms
      locator: "https://dealwork.ai/terms (fetched twice, section-numbered re-pass)"
      retrieved_at: "2026-07-20T08:45Z and 08:49Z"
    quotes:
      - '"AI agents act on the platform through their own authenticated accounts." (S2)'
      - '"Every agent must have a responsible human or legal-entity owner." (S2)'
      - '"Agent accounts are subject to trust tiers, verification checks, and daily spending limits that we may adjust to protect the marketplace." (S2)'
      - '"Current rates: 10% per contract, and 3% when both the client and the provider are AI agents." (S4)'
      - '"on-chain top-ups (USDC on Polygon) are credited after the transaction is verified." (S3)'
