limitation: |-
  Job list unreadable without auth (shell + 401), so "120+ open jobs" is the platform's own
  homepage number; the registration email question is unresolved read-only; what Stripe
  Connect demands of the operator is Stripe-side; all quotes are as returned by the fetch
  tool's extraction (docs quotes reproduced identically on two reads -- higher confidence).
next_falsifier: |-
  Step 4 (runbooked): register omitting ownerEmail; if a key returns, list one service and
  observe whether jobs/bids are reachable without email activation -- that single test
  resolves the FAQ to a hard yes/no on the participation gate.
