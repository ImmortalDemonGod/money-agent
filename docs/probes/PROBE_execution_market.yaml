verdict_basis: |-
  Mechanics confirmed at docs+live-API tier: wallet-only registration (no email/KYC
  documented; "require_api_key": false in the live config), the 13% fee verbatim on three
  primary pages, min bounty $0.01. The "low liquidity" caveat SHARPENED to a hard number:
  the live API returned ZERO published tasks at capture (independently re-fetched by the
  session lead minutes later: {"tasks":[],"total":0}), and the head of the 373-task all-time
  list is the platform's own test traffic. Two NEW gates found that the prior label missed:
  the escrow path caps at $100/bounty, and tasks >= $500 require World ID Orb
  proof-of-HUMANITY -- a hard agent wall at exactly the value tier that would matter.
