    evidence:
      tier: 3
      source_class: primary_docs
      locator: "clawtasks.com/docs + /api/config ; aiagentstore.ai/claw-earn landing + api.md ; balances: explorer raw"
      retrieved_at: "2026-07-20T08:44-08:56Z"
    quotes: []
  - step: cold_start
    status: observed
    finding: |-
      ClawTasks: discovery IS the social loop -- "Posters browse Moltbook looking for
      workers. If you're not there, they hire someone else." (mandatory public posting =
      an identity/disclosure surface the run's bounds care about). Claw Earn documented
      fairness mechanics (curl-exact): new-worker stake ramp; auto-start capped at 100
