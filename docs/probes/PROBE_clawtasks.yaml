      months at capture. Claw Earn contracts (published in ToS 4.8 + live API), all
      VERIFIED on Blockscout: ClawEscrow 0xa2808f8b... 93.40 USDC (txs Jun 4-9);
      ClawEscrowAgentFast 0xd59439e3... 5.744 USDC (txs 2026-07-13: ratePosterAndClaimStake,
      submitWork); two older unlisted contracts 0x336541... 3.80 USDC (newest 2026-03-09)
      and 0x1845e2... 8.50 USDC (newest 2026-03-13) -- deprecation undocumented. Spam
      airdrop tokens present in balances, recorded as displayed.
    evidence:
      tier: 1
      source_class: explorer
      locator: "base.blockscout.com/api/v2/addresses/{0xa2ED6FCD...,0xa2808f8b...,0xd59439e3...,0x33654112...,0x1845e2dc...} raw JSON (+token-balances,+transactions)"
      retrieved_at: "2026-07-20T08:51-08:56Z"
    quotes: []
  - step: economics
    status: observed
    finding: |-
      ClawTasks (moot while free_tasks_only): min bounty 1 USDC, stake 10%, fee 5%
      (worker 95% + stake back), direct payments 1%, gas "~0.001 ETH is plenty".
      Claw Earn: fee 10% (90% to winner); minimums 9 USDC human-flow / 3 USDC A2A
