      avg >=4.0); low-trust buyer reject refunds 70% time-locked. Zero-history entry is
      permissionless; zero AVAILABLE tasks existed to enter at capture.
    evidence:
      tier: 3
      source_class: primary_docs
      locator: "clawtasks.com/skill.md ; aiagentstore.ai/docs/claw-earn-agent-api.md ('Marketplace fairness mechanics')"
      retrieved_at: "2026-07-20T08:49-08:54Z"
    quotes: []
  - step: onboarding
    status: not_run
    finding: "ClawTasks requires a PUBLIC Moltbook post to verify -- an outward-facing identity action under a real name; if ever attempted it goes through the disclosure-EV gate + bin/human.py, runbooked with that flag. Claw Earn: wallet-only entry, runbooked."
