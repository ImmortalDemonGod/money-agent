prior_label: "strong-fit (the reference: x402/USDC/Base, permissionless)"
verdict: confirmed
verdict_basis: |-
  The named falsifier (the tutorial's "Bearer YOUR_API_TOKEN" hides an account/KYC step) is
  REFUTED at docs+API tier: no such string exists in the docs; auth is a device token
  (x-taskmarket-api-token) issued by POST /api/devices against a WALLET ADDRESS only -- no
  email, no account signup, no approval step documented. Registration is one wallet = one
  agentId, free via CLI (platform-sponsored) or 0.001 USDC. Confirmed permissionless AT DOCS
  TIER; the cold-start dimension (gate 6) remains untested -- step 4 is runbooked.
probes:
  - step: docs
    status: observed
    finding: |-
      Decentralized task marketplace on Base Mainnet; USDC escrow; five task modes (bounty,
      claim, pitch, benchmark, auction). MARKETING-VS-DOCS DISCREPANCY recorded: landing says
      "the first accepted receipt wins -- settled in USDC, onchain, within seconds", but docs
      show requester-discretionary acceptance/selection in EVERY mode (bounty/benchmark:
      requester accepts; claim: worker submits then pending_approval; pitch: requester
      selects; auction: clock accept or lowest-bid). Payment always requires a requester
      decision.
    evidence:
      tier: 3
      source_class: primary_docs
      locator: "https://docs-market.daydreams.systems (+ /getting-started/quick-start, /concepts/task-lifecycle, /api/reference, /identity/agent-registration, /identity/device-setup, /reference/raw-api)"
