name: CI

# The real project gate. Runs on every push to main and every PR:
#   sim         - the committed verification matrix (tests/sim.sh): a local
#                 two-lane git world asserting every guard terminal, gate
#                 adjudication, the edge verdict machine, SoD forgery, and the
#                 verifier convergence block. No keys, no network.
#   python      - byte-compile bin/ to catch syntax errors.
#   shellcheck  - lint every bin/ + tests/ shell script at default severity
#                 (the tree is clean; a new finding fails the build).
#   secret-scan - gitleaks, so a real credential can never land (run 1 leaked
#                 a token once); template placeholders are allowlisted.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: verification matrix (tests/sim.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # sim.sh does `git clone --bare` of the checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure git identity (sim.sh makes commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Run the verification matrix
        run: bash tests/sim.sh
        # The aiv-gate stage tests SKIP loudly without the aiv CLI (issue #20 item 3).
      - name: Run the Tier-0 regression corpus (issue #44)
        run: bash tests/corpus.sh
        # Replays run-1's REAL failure artifacts (the iter-095 false stop, the 086
        # empty commit) against the v2 gates, asserting on failure MESSAGES so a
        # wrong-reason refusal cannot read as coverage.

  python:
    name: python byte-compile (bin/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile all bin/ Python
        run: python3 -m compileall -q bin

  shellcheck:
    name: shellcheck (bin/ + tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck bin/*.sh tests/*.sh

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required by gitleaks-action v2 to scan PR commits
          GITLEAKS_CONFIG: .gitleaks.toml
