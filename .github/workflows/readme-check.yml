name: README check

# Lightweight integrity gate for the README and its diagram sources: relative
# links resolve, the hero/diagram assets exist, nav anchors match headers, code
# fences are balanced, and no curly quotes or em/en dashes drift in -- checked in
# the README prose AND the .github/assets/*.mmd sources that render into the
# committed diagram images. Stdlib-only, no dependencies. Scoped to docs surfaces
# so it never runs against harness changes.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - .github/assets/**
      - .github/scripts/check_readme.py
      - .github/workflows/readme-check.yml
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - .github/assets/**
      - .github/scripts/check_readme.py
      - .github/workflows/readme-check.yml

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check README integrity
        run: python3 .github/scripts/check_readme.py README.md
